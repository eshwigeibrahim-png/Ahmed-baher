<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض ورقة PDF</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f1e9;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 8px;
      background: #222;
      color: white;
      text-decoration: none;
    }

    .download {
      background: #96752b;
    }

    .pdf-frame {
      width: 100%;
      height: 75vh;
      min-height: 450px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .pdf-frame {
        height: 70vh;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>عرض ورقة PDF</h1>
    <p>يمكنك قراءة الورقة أدناه أو تنزيلها.</p>

    <div class="actions">
      <a class="btn download"
         href="documents/cv-ahmed baher.pdf"
         download="cv-ahmed baher.pdf">
        تنزيل PDF
      </a>

      <a class="btn"
         href="documents/cv-ahmed baher.pdf"
         target="_blank"
         rel="noopener">
        فتح في نافذة جديدة
      </a>
    </div>

    <iframe
      class="pdf-frame"
      src="documents/cv-ahmed baher.pdf"
      title="معاينة ملف PDF">
    </iframe>

    <p>
      إذا لم تظهر الورقة داخل الصفحة，
      <a href="documents/cv-ahmed baher.pdf" target="_blank"
         rel="noopener">افتح الملف مباشرة</a>.
    </p>
  </main>
</body>
</html>
